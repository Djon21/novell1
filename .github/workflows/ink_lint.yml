name: Ink Lint

on:
  push:
    paths:
      - "main/story/chapters/**/*.ink"
      - "tools/ink_lint.py"
  pull_request:
    paths:
      - "main/story/chapters/**/*.ink"
      - "tools/ink_lint.py"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Run ink linter
        run: python tools/ink_lint.py --ci
